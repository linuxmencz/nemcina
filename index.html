<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Němčina pro Čechy</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Druhá vrstva proti XSS; hash se musí shodovat s inline skriptem níže (hlídá ho tests/data.test.js) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-F1Sz0mQLZWwsjWaxHZI5bXIMLWrLykr0x1ftS3IC5gQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Němčina">
  <script>
    // Ruční volba vzhledu se použije hned, aby stránka neprobliknula ve špatném režimu.
    try {
      var t = JSON.parse(localStorage.getItem('nemcina-v1')).settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="back" type="button" hidden>← Zpět</button>
    <button id="home" class="brand" type="button"><img src="icons/icon-192.png" alt="" width="32" height="32">Němčina</button>
    <div class="stats">
      <span id="streak" title="Série dní za sebou">🔥 0</span>
      <span id="xp" title="Body">⭐ 0</span>
    </div>
  </header>
  <div id="beta-banner" class="beta-banner" role="note"><strong>⚠️ BETA verze.</strong> Aplikace se ještě zkouší: překlady, rody, výslovnost i nahrávky mohou obsahovat chyby. Chyby prosím nahlas tomu, kdo ti poslal odkaz.</div>
  <main id="app" aria-live="polite"></main>
  <nav id="tabs" class="tabbar" aria-label="Hlavní navigace" hidden>
    <button type="button" data-tab="path">🗺️ Cesta</button>
    <button type="button" data-tab="practice">🏋️ Procvičování</button>
    <button type="button" data-tab="progress">📈 Pokrok</button>
    <button type="button" data-tab="settings">⚙️ Nastavení</button>
  </nav>

  <script src="js/data/words.js"></script>
  <script src="js/data/extras.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/path.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/anki.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
